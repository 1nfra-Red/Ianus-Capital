<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0e1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ianus</title>
<style>
  :root{
    --bg:#0a0e1a; --ink:#eef2fb; --dim:#8b98ba; --faint:#5a6788;
    --card:#111830; --card2:#0f1528; --line:#212c49;
    --blue:#5b8def; --teal:#49c5c0; --indigo:#8f82f2; --rose:#e08aa8;
    --done:#57cf9e; --dawn:#f0b357; --coral:#ec8f6a; --gold:#e8b04b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5;overscroll-behavior-y:contain}
  body{background:
    radial-gradient(120% 60% at 50% -8%, #1a2340 0%, #101733 30%, transparent 60%),
    radial-gradient(90% 50% at 100% 0%, #171a3a 0%, transparent 55%),
    radial-gradient(80% 60% at 0% 100%, #10233a 0%, transparent 55%),
    radial-gradient(120% 42% at 50% 114%, #4a3326 0%, #2d1f2c 32%, transparent 62%),
    var(--bg);
    background-attachment:fixed}
  a{color:var(--blue);text-decoration:none}
  /* header */
  .top{position:sticky;top:0;z-index:15;padding:16px 20px 6px;
    background:linear-gradient(180deg,#0a0e1aee,#0a0e1a00)}
  .top .eyebrow{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--faint)}
  .top h1{margin:2px 0 0;font-size:15px;font-weight:600;letter-spacing:2px;color:var(--ink)}
  .top h1 b{color:var(--teal);font-weight:600}
  main{padding:8px 20px 108px;max-width:640px;margin:0 auto;position:relative;z-index:1}
  /* cards */
  .card{background:linear-gradient(160deg,#131a33,#0e1428);border:1px solid var(--line);
    border-radius:22px;padding:20px;margin:16px 0;box-shadow:0 10px 30px -18px #000;position:relative}
  .wm{position:absolute;top:16px;right:16px;width:56px;height:56px;opacity:.16;pointer-events:none;color:var(--gold)}
  .dawnband{position:absolute;left:-1px;right:-1px;top:-1px;height:74px;border-radius:22px 22px 0 0;
    pointer-events:none;background:radial-gradient(80% 130% at 50% 0%, #f0b3571f, #ec8f6a10 45%, transparent 72%)}
  .januswm-lg{color:var(--gold)}
  .glow{border:1px solid #2a3a63;
    background:linear-gradient(160deg,#182247,#101733);
    box-shadow:0 0 0 1px #22305aaa,0 18px 50px -22px #2b3f7a}
  .eye{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--blue);font-weight:700}
  .card h2{margin:8px 0 0;font-size:21px;font-weight:600;letter-spacing:.2px;line-height:1.28}
  .card .sub{color:var(--dim);font-size:14px;margin-top:8px}
  .lead-title{font-size:24px;font-weight:600;letter-spacing:.2px;line-height:1.25}
  /* orbit */
  .orbit-wrap{display:flex;flex-direction:column;align-items:center;padding:14px 0 4px}
  .orbit{position:relative;width:190px;height:190px}
  .orbit .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .orbit .pctnum{font-size:40px;font-weight:300;letter-spacing:-1px}
  .orbit .pctlbl{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--faint);margin-top:2px}
  .orbit .wk{font-size:12px;color:var(--teal);letter-spacing:1px;margin-top:6px}
  /* objective / list card */
  .item{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-top:1px solid var(--line)}
  .item:first-child{border-top:0}
  .ck{flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:1.6px solid #33406a;
    background:#0d1428;display:flex;align-items:center;justify-content:center;color:transparent;
    font-size:15px;transition:.18s;margin-top:2px}
  .item.done .ck{background:radial-gradient(circle at 35% 30%,#6fe0ad,#3aa87c);
    border-color:transparent;color:#04150d;box-shadow:0 0 16px -2px #57cf9e88}
  .item .bd{flex:1;min-width:0}
  .item .mt{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--indigo);font-weight:700}
  .item .tt{font-size:16px;font-weight:500;margin-top:3px;line-height:1.35}
  .item.done .tt{color:var(--dim)}
  .item .dt{font-size:11.5px;color:var(--faint);margin-top:3px;letter-spacing:.5px}
  .chev{color:var(--faint);font-size:20px;align-self:center;flex:0 0 auto}
  .tap{cursor:pointer}
  /* segmented */
  .seg{display:flex;gap:8px;margin:6px 0 2px;overflow-x:auto;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{flex:0 0 auto;background:#0f1730;border:1px solid var(--line);color:var(--dim);
    padding:9px 16px;border-radius:22px;font-size:13px;font-weight:600;letter-spacing:.3px}
  .seg button.on{color:#06121f;border-color:transparent;
    background:linear-gradient(120deg,var(--teal),var(--blue))}
  /* inputs */
  input,textarea,select{width:100%;background:#0d1426;border:1px solid var(--line);color:var(--ink);
    border-radius:14px;padding:13px 14px;font-size:15px;font-family:inherit}
  textarea{min-height:120px;resize:vertical}
  .btn{display:block;width:100%;text-align:center;border-radius:16px;padding:14px;font-size:15px;
    font-weight:600;margin-top:12px;border:1px solid transparent;
    background:linear-gradient(120deg,var(--blue),var(--indigo));color:#fff}
  .btn.ghost{background:transparent;border-color:var(--line);color:var(--dim)}
  .btn.teal{background:linear-gradient(120deg,var(--teal),var(--blue));color:#06121f}
  .btn.sm{width:auto;display:inline-block;padding:10px 16px;font-size:13px;margin-top:0}
  .row{display:flex;gap:10px}.row>*{flex:1}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
  .kv:first-child{border-top:0}.kv .v{font-weight:600}
  .big{font-size:36px;font-weight:300;letter-spacing:-1px}
  .tiny{font-size:12px;color:var(--faint);letter-spacing:.3px}
  .muted{color:var(--dim);font-size:14px}
  .pillrow{margin-top:10px}
  .chip{display:inline-block;background:#0f1730;border:1px solid var(--line);border-radius:16px;
    padding:11px 15px;margin:5px 6px 0 0;font-size:13px;color:var(--ink);font-weight:600}
  .chip.on{background:linear-gradient(120deg,#182247,#1b2b52);border-color:#2c3d63}
  .tick{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
  .tick:first-child{border-top:0}
  .tick .sym{font-weight:700;font-size:15px;letter-spacing:.5px}
  .tick .nm{font-size:11px;color:var(--faint)}
  .tick .px{font-weight:600;font-size:16px;text-align:right}
  .up{color:var(--done)}.down{color:#e88}
  .x{color:#e88;background:none;border:0;font-size:14px;font-weight:700;padding:6px}
  .rowitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-top:1px solid var(--line)}
  .rowitem:first-child{border-top:0}
  .rowitem .fn{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* hub grid */
  .hub{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
  .hubcell{background:linear-gradient(160deg,#131a33,#0e1428);border:1px solid var(--line);
    border-radius:20px;padding:20px 16px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between}
  .hubcell .ic{width:26px;height:26px;color:var(--teal)}
  .hubcell .lb{font-size:15px;font-weight:600;margin-top:10px}
  .hubcell .ds{font-size:11.5px;color:var(--faint);margin-top:2px}
  /* bottom nav */
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:linear-gradient(180deg,#0b0f1dcc,#0a0e1a);border-top:1px solid var(--line);
    backdrop-filter:blur(12px);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1;background:none;border:0;color:var(--faint);display:flex;flex-direction:column;
    align-items:center;gap:4px;font-size:10.5px;letter-spacing:.5px;padding:4px 0}
  .tabbar button.on{color:var(--teal)}
  .tabbar svg{width:23px;height:23px}
  .tabbar button.on svg{filter:drop-shadow(0 0 6px #49c5c0aa)}
  /* immersive reveal */
  .reveal{position:fixed;inset:0;z-index:60;background:
    radial-gradient(120% 55% at 50% 8%, #1b2547 0%, transparent 55%),
    radial-gradient(80% 50% at 50% 100%, #14263f 0%, transparent 55%), #080b16;
    overflow-y:auto;opacity:0;transform:translateY(14px);transition:.32s ease;pointer-events:none}
  .reveal.show{opacity:1;transform:none;pointer-events:auto}
  .reveal .inner{max-width:600px;margin:0 auto;padding:30px 26px 60px;min-height:100%;
    display:flex;flex-direction:column;position:relative}
  .reveal .dawnhead{position:absolute;left:0;right:0;top:0;height:260px;pointer-events:none;z-index:0;
    background:radial-gradient(72% 100% at 50% 0%, #f0b3572e, #e08aa816 44%, transparent 72%)}
  .reveal .inner>*{position:relative;z-index:1}
  .reveal .back{background:none;border:0;color:var(--dim);font-size:15px;padding:6px 0;align-self:flex-start;letter-spacing:.5px}
  .reveal .rmeta{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--indigo);
    font-weight:700;margin-top:26px}
  .reveal .rtitle{font-size:30px;font-weight:300;line-height:1.22;margin-top:14px;letter-spacing:-.3px}
  .reveal .rdate{color:var(--teal);font-size:13px;letter-spacing:1px;margin-top:10px}
  .reveal .rbody{font-size:16.5px;line-height:1.68;color:#cfd8ee;margin-top:26px}
  .reveal .rbody .lead{color:var(--ink)}
  .reveal .racts{margin-top:24px}
  .reveal .racts .a{display:flex;gap:12px;padding:12px 0;border-top:1px solid #1c2745;font-size:15px;color:#dbe3f5}
  .reveal .racts .a .d{color:var(--teal)}
  .reveal .note{margin-top:26px;padding:18px 18px 18px 20px;border-left:2px solid var(--indigo);
    background:#0e152b;border-radius:0 14px 14px 0;color:var(--dim);font-size:14.5px;line-height:1.6}
  .reveal .spacer{flex:1}
  .saved{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);z-index:70;
    background:linear-gradient(120deg,var(--teal),var(--blue));color:#06121f;font-weight:700;font-size:13px;
    padding:9px 18px;border-radius:22px;opacity:0;transition:.3s;pointer-events:none}
  .saved.show{opacity:1}
  hr{border:0;border-top:1px solid var(--line);margin:16px 0}
  .starfield{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5}
</style>
</head>
<body>
<canvas class="starfield" id="stars"></canvas>
<div class="top">
  <div style="display:flex;align-items:center;gap:12px">
    <svg viewBox="0 0 24 24" fill="none" stroke="#e8b04b" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" style="width:30px;height:30px;flex:0 0 auto;filter:drop-shadow(0 0 6px #e8b04b55)">
      <circle cx="12" cy="12" r="10.4" stroke="#e8b04b" stroke-width="1" opacity="0.5"/>
      <line x1="12" y1="4" x2="12" y2="20"/>
      <path d="M12 4.2C15.2 4.2 17.6 6.4 18.1 9.1C18.4 10.9 17.7 11.4 18.6 12.4L19.6 13.6L17.7 14.4C18.6 15.3 18.4 16.3 17.1 16.9L17.7 18.6C16.8 20.3 14.4 20 12 20"/>
      <path d="M12 4.2C8.8 4.2 6.4 6.4 5.9 9.1C5.6 10.9 6.3 11.4 5.4 12.4L4.4 13.6L6.3 14.4C5.4 15.3 5.6 16.3 6.9 16.9L6.3 18.6C7.2 20.3 9.6 20 12 20"/>
      <circle cx="15.9" cy="10" r="0.85" fill="#e8b04b" stroke="none"/>
      <circle cx="8.1" cy="10" r="0.85" fill="#e8b04b" stroke="none"/>
    </svg>
    <div>
      <div class="eyebrow" id="eyebrow">FOUNDER COCKPIT</div>
      <h1><b>IANUS</b></h1>
    </div>
  </div>
</div>
<main id="main"></main>

<div class="tabbar" id="tabbar"></div>
<div class="reveal" id="reveal"><div class="inner" id="revealInner"></div></div>
<div class="saved" id="saved">Saved</div>

<script>
/* ===================== STATE ===================== */
const LS='ianus_cockpit_v2';
const DEFAULT={done:{},read:{},balance:0,balanceAt:'',fund:150,fundTarget:4000,
  notes:'',contacts:[],articles:[],
  tickers:['bitcoin','ethereum','iota','ripple','chainlink','usd-coin']};
let S=load();
function load(){try{return Object.assign({},DEFAULT,JSON.parse(localStorage.getItem(LS))||{})}catch(e){return Object.assign({},DEFAULT)}}
function save(){try{localStorage.setItem(LS,JSON.stringify(S));toast()}catch(e){}}
let _t;function toast(){const s=document.getElementById('saved');s.classList.add('show');clearTimeout(_t);_t=setTimeout(()=>s.classList.remove('show'),900)}

/* ===================== CONTENT ===================== */
const YEARLY=[
 {id:'y0',meta:'THE DESTINATION',t:'Stand up the legal body, the bank, and the founder fund that make you real to this system.',note:'Nothing in US healthcare moves without a legal entity and a tax ID behind it. This is the cornerstone \u2014 you place it first.'},
 {id:'y1',meta:'PROOF OF PROBLEM',t:'Confirm exactly where the wedge lives: 30 field interviews, coded, pain named in operators\u2019 own words.',note:'You are not hoping the friction exists. You are locating it precisely so you cut the first channel in the right place.'},
 {id:'y2',meta:'THE NUMBERS',t:'Build the economic model as a sensitivity \u2014 the incumbent-cost delta is the one variable a real extract will set.',note:'The venture lives or dies on one question: is the administrative waste large enough to price against? You answer it with data, not faith.'},
 {id:'y3',meta:'THE FIRST ARTIFACT',t:'A working prototype of the claims/authorization engine, attacked by a real claims professional and rebuilt.',note:'A boring, correct interface that a biller recognizes beats any elegant idea. The click in their workflow is the real product.'},
 {id:'y4',meta:'THE OPENING',t:'One partner who wants the 90-day proof-of-value \u2014 with a clean 42 CFR Part 2 data path mapped.',note:'SUD data is the most protected class in US healthcare. Whoever solves the consent path first owns the entry. That is your edge.'},
 {id:'y5',meta:'FUNDABLE',t:'An evidence book and a 10\u201312 slide deck that make the next dollar someone else\u2019s risk, not yours.',note:'You bootstrap the evidence; investors fund the build. Sequence it that way and you keep control of what you were tasked to bring to light.'},
 {id:'y6',meta:'CLEARANCE',t:'Name resolved (or a clean codename) and your employment/IP position confirmed \u2014 both settled early.',note:'The name becomes real the day you file the entity. Your day job is the unlock and the landmine. Clear both before they cost you.'},
];
const QUARTERLY=[
 {id:'q1',meta:'Q1 \u00b7 SEP\u2013NOV 2026 \u00b7 FOUNDATION + VALIDATION',t:'Become real, then go listen.',note:'Form the entity, pull the EIN, open Mercury, start the Founder Fund. Then run the first ~18 interviews. Laying rail and mapping terrain at once.'},
 {id:'q2',meta:'Q2 \u00b7 DEC 2026\u2013FEB 2027 \u00b7 DEFINITION',t:'Turn what you heard into a product and a number.',note:'Finish 30 interviews, write the validation memo against a kill criterion set in advance, build the commercial model and sensitivity economics, spec the MVP and architecture.'},
 {id:'q3',meta:'Q3 \u00b7 MAR\u2013MAY 2027 \u00b7 PROTOTYPE + PILOT',t:'Build the first artifact and find the door.',note:'Partner conversations, a pilot signal or LOI, the 90-day proof-of-value designed Part 2-clean, a prototype an expert tears into, before/after workflow modeling.'},
 {id:'q4',meta:'Q4 \u00b7 JUN\u2013AUG 2027 \u00b7 FINANCING READINESS',t:'Assemble the case and open the conversations.',note:'Targeted counsel, the nine-month checkpoint, the evidence book, the investor deck, relationship mapping, financing research and documents, first financing talks.'},
];
const WEEKLY=[
 {id:'w1',date:'Wed Sep 9, 2026',meta:'PIECE 1 \u00b7 THE CORNERSTONE',t:'Open the Founder Fund and decide the legal body this venture will inhabit.',
   acts:['Create the Ianus Founder Fund (separate account/sub-account); move the first $150.','Decide the name path: clear \u201cIanus\u201d with a basic trademark screen, OR form under a neutral LLC name now and hold \u201cIanus\u201d as a future DBA.','Read the source protocol once, asking only: what must be true for a real employer or TPA to pay for this?'],
   note:'Field note \u2014 the entity is not paperwork, it is your standing. Claims, contracts, and bank rails all attach to a registered legal person with a tax ID. Filing the LLC is the moment your name choice becomes public and permanent, so settle the name before you file.'},
 {id:'w1b',date:'Sep 9\u201312 \u00b7 first agenda',meta:'PIECE 1 \u00b7 EIN + MERCURY',t:'Form the LLC \u2192 pull the EIN \u2192 open Mercury, in that exact order.',
   acts:['Form the LLC with your state (no EIN for banking without the entity first).','Apply for the EIN free at irs.gov \u2014 online, ~15 min once the LLC exists. Never pay a third party.','Wait until the EIN is confirmed, then apply to Mercury (10 min). Have ready: Articles of Organization, EIN letter, a real US operational address (not just a registered agent \u2014 that now triggers rejections), a clear one-line business description, and your ID.','Employment/IP self-audit: read your employment agreement for IP-assignment and outside-venture terms before using any work relationship or data.'],
   note:'Field note \u2014 how money enters this system: an employer funds a bank account, a claim gets adjudicated, a payment fires from that account to a provider. You are building the founder\u2019s end of that same plumbing. Mercury is a fintech, not a bank (services via Choice Financial Group & Column N.A.) \u2014 fine for operating capital; describe it accurately.'},
 {id:'w2',date:'Wed Sep 23, 2026',meta:'PIECE 2 \u00b7 THE MAP',t:'Write the one-page problem statement and build the 30-person interview list.',
   acts:['List 30 names: SUD facilities, TPAs, brokers, employers, stop-loss pros, healthcare counsel.','Draft neutral discovery questions \u2014 collect operational language, don\u2019t pitch.','Book a scoped legal consult on two questions only: your IP/employment exposure, and whether \u201csoftware under a licensed TPA\u201d keeps you clear of Maryland TPA-licensing.','Decide the name: trademark screen or working codename. Stop building branded assets until settled.'],
   note:'Field note \u2014 US health insurance is not one thing. It is a stack: eligibility, prior authorization, claims, payment, credentialing, stop-loss. Each layer is a separate business with its own friction. Your job here is to find which layer bleeds most for the people who feel it.'},
 {id:'w3',date:'Wed Oct 7, 2026',meta:'PIECE 2 \u00b7 FIRST CONTACT',t:'Run 3\u20135 interviews. Write down the pain in their words, not yours.',
   acts:['Document friction in authorization, claims, payment, eligibility, appeals, stop-loss.','Confirm your pre-registered kill criterion is written and unchanged.'],
   note:'Field note \u2014 the self-funded ERISA employer is the buyer that matters. They pay their own claims and only rent administration. That is why they can carve out one service line to you without a national insurer\u2019s permission. Everything you build enters through that door.'},
 {id:'w4',date:'Wed Oct 21, 2026',meta:'PIECE 2 \u00b7 EVIDENCE',t:'Run 5 more interviews and start coding what you hear.',
   acts:['Spreadsheet: recurring problem, who it hits, current workaround, frequency, rough cost.','Do not mistake a vivid anecdote for market size.'],
   note:'Field note \u2014 the TPA is the hands on the claim: eligibility, adjudication, payment. In your model a recognized TPA is the licensed face and you are the tooling underneath. The carrier trusts the TPA it already knows \u2014 not your software. Remember whose name reassures the room.'},
 {id:'w5',date:'Wed Nov 4, 2026',meta:'PIECE 2 \u00b7 WHO SIGNS',t:'Run 5 more. Find who owns the problem and who can authorize a pilot.',
   acts:['Separate the people who feel the pain from the people who can spend to fix it.','Note which prospects are structurally hard to serve first \u2014 avoid them.'],
   note:'Field note \u2014 stop-loss is the reinsurance layer that catches catastrophic claims for a self-funded employer, and the stop-loss underwriter holds the real veto. No bound stop-loss, no go-live. Bind is the critical path \u2014 not any technology milestone.'},
 {id:'w6',date:'Wed Nov 18, 2026',meta:'PIECE 2 \u00b7 SYNTHESIS',t:'Close the first interview cycle. Compare every vantage point.',
   acts:['Lay facility, TPA, broker, employer, and stop-loss views side by side.','Start a list of places the original thesis is wrong.'],
   note:'Field note \u2014 prior authorization is where delay becomes clinical harm and lost revenue. In SUD, an auth measured in days equals bed-days of unpaid census. That single friction is the sharpest edge of your wedge \u2014 latency you can measure and cut.'},
 {id:'w7',date:'Wed Dec 2, 2026',meta:'PIECE 3 \u00b7 THE VERDICT',t:'Finish the interviews. Write \u201cMarket Validation v1\u201d and apply the kill criterion.',
   acts:['State in writing whether the criterion was met. If not, change the wedge before any build.','Pick the 2\u20133 pains repeated often enough to justify product work.'],
   note:'Field note \u2014 the claim lifecycle is 837 in, 835 out: a provider submits an 837, the payer adjudicates, an 835 remittance and payment come back \u2014 today, 14\u201330 days later. Your rail collapses that to same/next-day on clean claims. That speed is the demo.'},
 {id:'w8',date:'Wed Dec 16, 2026',meta:'PIECE 3 \u00b7 THE MODEL',t:'Define the commercial model and what you will never monetize.',
   acts:['Set customer, buyer, user, implementation fee, PEPM, possible claim fee, optional services.','Separate revenue from any regulated risk-bearing activity.','Name what stays off the table: PHI, provider collateral, token appreciation, DeFi yield, clinical decisions.'],
   note:'Field note \u2014 you get paid to administer, not to bear risk. The moment you take premium risk you become an insurer and the state-licensing wall drops. Stay on the software side; let licensed carriers hold the risk. That boundary keeps you shippable.'},
 {id:'w9',date:'Wed Dec 30, 2026',meta:'PIECE 3 \u00b7 THE NUMBER',t:'Build the 10,000-life model as a bear/base/bull sensitivity.',
   acts:['Revenue = PEPM \u00d7 12 \u00d7 lives + implementation + optional claim fee.','Make the incumbent-cost delta the free variable; every figure illustrative until a real extract lands.','Run payback. The bear case must be survivable, not hidden.'],
   note:'Field note \u2014 admin is roughly a quarter to a third of US healthcare spend, most of it transaction friction. Halving denials and auth latency captures a real slice even while risk stays with employers and reinsurers. You drain waste, not seize the whole scheme.'},
 {id:'w10',date:'Wed Jan 13, 2027',meta:'PIECE 3 \u00b7 HOLD',t:'Protect the holiday. Preserve capital. Sharpen the thesis.',
   acts:['No major spend. Archive all research. Keep the Fund intact.'],
   note:'Field note \u2014 cash accumulation is itself progress. Restraint now is what lets a scoped attorney or a real pilot get paid later. The discipline is the strategy.'},
 {id:'w11',date:'Wed Jan 27, 2027',meta:'PIECE 4 \u00b7 THE SPEC',t:'Draft the MVP: SUD Claims & Authorization Intelligence.',
   acts:['Prioritize eligibility, authorization readiness, documentation, denial prediction, claim status, appeals support, audit trail.','Explicitly exclude autonomous clinical judgment.'],
   note:'Field note \u2014 the engine answers an administrative question (\u201cdoes this claim satisfy the written rule?\u201d), never a clinical one. A licensed clinician signs necessity; your machine executes policy deterministically. Keep that line bright and you are never \u201cthe AI that denied care.\u201d'},
 {id:'w12',date:'Wed Feb 10, 2027',meta:'PIECE 4 \u00b7 THE BLUEPRINT',t:'Draft the technical architecture, ledger deferred.',
   acts:['Map employer \u2192 TPA \u2192 Ianus \u2192 provider \u2192 claim \u2192 payment.','Define policy compiler, deterministic rules, conventional database, audit log, FHIR/X12 interfaces, ConsentObject (Part 2).','Keep a distributed ledger as a later option only.'],
   note:'Field note \u2014 you are building a rail, not a coin. Year 0 runs on a boring database and a signed audit log. A ledger is a Phase-2 question you ask only once a multi-employer book creates real cross-entity need. The buyer must never learn a blockchain to say yes.'},
 {id:'w13',date:'Wed Feb 24, 2027',meta:'PIECE 5 \u00b7 FIRST DOORS',t:'Start partner conversations. Describe infrastructure, never \u201cblockchain.\u201d',
   acts:['Approach prospective TPAs, brokers, SUD providers. Seek critique and pilot criteria.','Probe the provider-side data path \u2014 a facility sharing its own records is the easiest first data.'],
   note:'Field note \u2014 42 CFR Part 2 governs SUD records with consent stricter than HIPAA. Real claims data is the hardest thing to get and the thing your demo needs. Prove the engine on synthetic/public data first, then get real data provider-side under proper consent. Sequence around the chokepoint.'},
 {id:'w14',date:'Wed Mar 10, 2027',meta:'PIECE 5 \u00b7 THE SIGNAL',t:'Ask for a conditional pilot conversation or an LOI.',
   acts:['Define exactly what evidence the partner would need to proceed.','Do not ask for investment yet.'],
   note:'Field note \u2014 mental-health parity (MHPAEA) says SUD limits can\u2019t be tighter than medical. A published, cited policy graph defends a parity review better than any black box. That is a fiduciary argument you hand the employer\u2019s counsel \u2014 not a crypto argument.'},
 {id:'w15',date:'Wed Mar 24, 2027',meta:'PIECE 5 \u00b7 THE PROOF DESIGN',t:'Design the 90-day proof-of-value, Part 2-clean.',
   acts:['Stage 1: synthetic/public data. Stage 2: a provider\u2019s own records under BAA + Part 2 consent. Live parallel only after data, privacy, and legal gates clear in writing.','Shadow-adjudicate against decisions already made; surface variance.'],
   note:'Field note \u2014 shadow adjudication is your killer demo: \u201cgive us your claims history and we\u2019ll show where your current system delays, denies, and reworks \u2014 and whether our engine reproduces the right calls.\u201d It changes nothing financially, so it is safe to say yes to.'},
 {id:'w16',date:'Wed Apr 7, 2027',meta:'PIECE 6 \u00b7 THE ARTIFACT',t:'Build the first clickable prototype. Make it deliberately boring.',
   acts:['Show claim intake, eligibility, authorization, policy references, status, payment, audit trail.','Match existing workflows; surprise nobody.'],
   note:'Field note \u2014 every decision should be reproducible: which rule, which plan version, which inputs, which reviewer, when. That record is the audit and parity proposition in one. Build the decision trail first; the UI is the wrapper.'},
 {id:'w17',date:'Wed Apr 21, 2027',meta:'PIECE 6 \u00b7 THE STRESS TEST',t:'Have an experienced claims/TPA professional attack the prototype.',

 {id:'w18',date:'Wed May 5, 2027',meta:'PIECE 6 \u00b7 BEFORE / AFTER',t:'Model current-state vs Ianus-state and build the pilot scorecard.',

 {id:'w19',date:'Wed May 19, 2027',meta:'PIECE 7 \u00b7 THE ASK',t:'Pursue formal pilot interest with one partner.',

 {id:'w20',date:'Wed Jun 2, 2027',meta:'PIECE 7 \u00b7 COUNSEL',t:'Buy targeted legal advice \u2014 deepen, don\u2019t begin, the review.',

const COMPASS=[
 {t:'What US health insurance actually is',x:'It is not one product \u2014 it is a stack of administrative functions bolted together: eligibility, prior authorization, claims, payment, credentialing, stop-loss, pharmacy. Each is a separate business with its own friction and its own incumbents. You are not \u201creplacing insurance.\u201d You are choosing one layer, proving you run it cheaper and faster, then adding the next. Hold that frame and the whole thing stops being overwhelming.'},
 {t:'Who actually holds the risk',x:'Large employers often don\u2019t buy insurance \u2014 they pay their own claims and only rent administration. This is \u201cself-funded,\u201d governed by a federal law, ERISA, which preempts a lot of state insurance regulation. That is why a self-funded employer can carve out one service line to a new vendor without a national insurer\u2019s permission. This employer is your buyer, and ERISA is the door you enter through.'},
 {t:'The TPA \u2014 hands on the claim',x:'A third-party administrator processes eligibility, adjudicates claims, and issues payment for a self-funded plan. In your model a recognized TPA is the licensed, contracting face; Ianus is the tooling underneath. This matters because the stop-loss carrier trusts a TPA it already knows \u2014 not unproven software. You ride in under a name the room already trusts.'},
 {t:'Stop-loss \u2014 the veto',x:'A self-funded employer buys stop-loss to cap catastrophic claims. The stop-loss underwriter must be willing to bind on your arrangement \u2014 and that bind, not any tech milestone, is the true go-live gate. Learn this early: the underwriter is the quietest and most powerful signature on the page.'},
 {t:'Prior authorization \u2014 your wedge',x:'Before certain care is covered, it must be authorized. In SUD, authorization measured in days equals bed-days of unpaid census and real clinical harm. This latency is measurable, hated, and reformable \u2014 which is exactly why it is the sharpest edge of your entry. You are selling the cure to a pain everyone already feels.'},
 {t:'How money moves \u2014 837 in, 835 out',x:'A provider submits a claim (an X12 837). The payer adjudicates it. A remittance (835) and a payment come back \u2014 today, 14\u201330 days later through clearinghouses. Your rail keeps speaking 837/835 on the outside but collapses clean-claim payment to same or next day. Same language, radically faster. That speed is the demonstration.'},
 {t:'Why SUD is the softest entry',x:'Substance-use treatment has the highest out-of-network inflation, the worst prior-auth pain, and employers already prepared to carve it out to a specialist. It is the one flow the old system is worst at \u2014 which is precisely where a new rail displaces an incumbent. You attack the weak seam first, on purpose.'},
 {t:'42 CFR Part 2 \u2014 the vault',x:'SUD treatment records get protection stricter than HIPAA under a federal rule called Part 2: consent-gated, with re-disclosure notices that travel with the record. This is why real claims data is hard to get \u2014 and why solving the consent path is your edge, not your obstacle. Prove the engine on synthetic data first; get real data provider-side under proper consent.'},
 {t:'Parity \u2014 your fiduciary lever',x:'Federal parity law (MHPAEA) says the limits a plan puts on mental-health and SUD care can\u2019t be tighter than on medical care. A published, cited policy graph defends a parity review far better than a black-box denial engine. You hand the employer\u2019s lawyers a defense \u2014 that is a fiduciary argument, and it sells without a single word about crypto.'},
 {t:'Why a rail, not an insurer',x:'The instant you take premium risk you become an insurer and hit the state-licensing wall. So you stay administrative: software and settlement, licensed partners holding the risk. And the blockchain? It waits until a multi-employer book creates a real cross-entity need. Year 0 is a boring database and a signed audit log. Boring is what ships. Boring is what wins.'},
];

function sunRays(cx,cy,r,op){let s='';for(let i=0;i<12;i++){const a=i*30*Math.PI/180;
  const x1=cx+Math.cos(a)*r*0.66,y1=cy+Math.sin(a)*r*0.66,x2=cx+Math.cos(a)*r,y2=cy+Math.sin(a)*r;
  s+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#f0b357" stroke-width="1.3" stroke-linecap="round" opacity="${op}"/>`;}
  return `<g>${s}</g>`;}

/* ===================== HELPERS ===================== */
function pct(list){if(!list.length)return 0;return list.filter(o=>S.done[o.id]).length/list.length*100}
function orbit(p,label,week){
  const r=82,c=2*Math.PI*r,off=c*(1-p/100);
  const ang=(-90+360*(p/100))*Math.PI/180;
  const sx=(95+r*Math.cos(ang)).toFixed(1), sy=(95+r*Math.sin(ang)).toFixed(1);
  return `<div class="orbit"><svg width="190" height="190" viewBox="0 0 190 190">
    <defs><linearGradient id="og" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#49c5c0"/><stop offset="0.55" stop-color="#5b8def"/><stop offset="1" stop-color="#f0b357"/></linearGradient>
      <radialGradient id="sunc" cx="50%" cy="45%" r="55%">
        <stop offset="0" stop-color="#ffe7b4"/><stop offset="0.55" stop-color="#f0b357"/><stop offset="1" stop-color="#ec8f6a"/></radialGradient>
      <radialGradient id="sung" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#f0b35759"/><stop offset="1" stop-color="#f0b35700"/></radialGradient></defs>
    <circle cx="95" cy="95" r="${r}" fill="none" stroke="#1c2745" stroke-width="6"/>
    <circle cx="95" cy="95" r="${r}" fill="none" stroke="url(#og)" stroke-width="6" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 95 95)"/>
    ${sunRays(95,95,50,0.24)}
    <circle cx="95" cy="95" r="38" fill="url(#sung)"/>
    <circle cx="${sx}" cy="${sy}" r="11" fill="url(#sung)"/>
    <circle cx="${sx}" cy="${sy}" r="5.5" fill="url(#sunc)"/>
  </svg><div class="ctr"><div class="pctnum">${Math.round(p)}%</div>
    <div class="pctlbl">${label}</div>${week?`<div class="wk">${week}</div>`:''}</div></div>`;
}
function currentWeekIndex(){
  const today=new Date();let idx=0;
  for(let i=0;i<WEEKLY.length;i++){const m=WEEKLY[i].date.match(/([A-Za-z]{3}) (\d+), (\d{4})/);
    if(m){const dt=new Date(`${m[1]} ${m[2]}, ${m[3]}`);if(dt<=today)idx=i;}}
  return idx;
}

/* ===================== REVEAL ===================== */
function openReveal(o,kind){
  const inner=document.getElementById('revealInner');
  const done=!!S.done[o.id];
  let acts='';
  if(o.acts)acts='<div class="racts">'+o.acts.map(a=>`<div class="a"><span class="d">\u25c6</span><span>${a}</span></div>`).join('')+'</div>';
  const btn=(kind==='obj')?`<button class="btn ${done?'ghost':'teal'}" onclick="toggleFromReveal('${o.id}')">${done?'\u2713 Completed \u00b7 tap to undo':'Mark this piece complete'}</button>`:'';
  const readBtn=(kind==='lesson')?`<button class="btn ${done?'ghost':'teal'}" onclick="toggleFromReveal('${o.id}')">${done?'\u2713 Marked as read':'Mark as understood'}</button>`:'';
  inner.innerHTML=`
    <div class="dawnhead"></div>
    <button class="back" onclick="closeReveal()">\u2039 Back</button>
    <div class="rmeta">${o.meta||''}</div>
    <div class="rtitle">${o.t}</div>
    ${o.date?`<div class="rdate">${o.date}</div>`:''}
    ${o.x?`<div class="rbody">${o.x}</div>`:''}
    ${acts}
    ${o.note?`<div class="note">${o.note}</div>`:''}
    <div class="spacer"></div>
    ${btn}${readBtn}`;
  const r=document.getElementById('reveal');r.classList.add('show');
  document.getElementById('reveal').scrollTop=0;
}
function closeReveal(){document.getElementById('reveal').classList.remove('show')}
function toggleFromReveal(id){S.done[id]=!S.done[id];save();
  const list=WEEKLY.concat(YEARLY,QUARTERLY);let o=list.find(z=>z.id===id);
  let kind='obj';
  if(!o){o=COMPASS.map((l,i)=>({id:'c'+i,meta:'THE BIGGER PICTURE',t:l.t,x:l.x})).find(z=>z.id===id);kind='lesson';}
  if(o)openReveal(o,kind);draw();
}
function quickToggle(id,ev){ev.stopPropagation();S.done[id]=!S.done[id];save();draw()}

function composePrompt(){
  const q=document.getElementById('aq').value.trim();const mode=document.getElementById('amode').value;const ctx=assistantCtx();

    consult:'Act as a candid expert advisor in US health-insurance administration and early-stage strategy. Push back where I\u2019m wrong. No flattery.',
    task:'Break this into a concrete, ordered checklist I can execute this week. Note any dependency or gate before each step.',
    field:'Teach me the underlying mechanics of how this part of the US insurance complex works, assuming I\u2019m sharp but new to this specific field. Plain language, a concrete example.',
    committee:'I am asking three different AI assistants this same question. Answer independently and thoroughly. At the end, list the 3 points you are most confident about and the 1 most likely to be wrong.'};
  let p=ctx+'\n\n'+heads[mode]+'\n\nMy question/task:\n'+(q||'(fill in your question above)');

async function feed(i){const [label,q]=NEWS_TOPICS[i];const el=document.getElementById('feed');
  el.innerHTML=`<div class="tiny">Loading \u201c${label}\u201d\u2026</div>`;
  const rss='https://news.google.com/rss/search?q='+encodeURIComponent(q)+'&hl=en-US&gl=US&ceid=US:en';
  const prox='https://api.allorigins.win/raw?url='+encodeURIComponent(rss);
  try{const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),7000);
    const r=await fetch(prox,{signal:ctrl.signal});clearTimeout(to);const txt=await r.text();
    const items=[...new DOMParser().parseFromString(txt,'text/xml').querySelectorAll('item')].slice(0,8);
    if(!items.length)throw 0;
    el.innerHTML=`<div class="eye" style="margin-bottom:6px">${label}</div>`+items.map(it=>{
      const title=(it.querySelector('title')||{}).textContent||'';const link=(it.querySelector('link')||{}).textContent||'#';
      const date=(it.querySelector('pubDate')||{}).textContent||'';
      return `<div class="rowitem"><div style="min-width:0"><a href="${link}" target="_blank" style="font-size:14px">${title}</a><div class="tiny">${date.replace(' GMT','')}</div></div></div>`;}).join('');
  }catch(e){el.innerHTML=`<div class="tiny">In-app feed couldn\u2019t load (offline, or the free relay is busy). Open in the browser instead:</div>
    <button class="btn sm teal" style="margin-top:8px" onclick="openNews('${q.replace(/'/g,"")}')">Open ${label} \u2192</button>`;}
}

let DB;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('ianus_files',1);
  r.onupgradeneeded=e=>e.target.result.createObjectStore('files',{keyPath:'id'});
  r.onsuccess=e=>{DB=e.target.result;res()};r.onerror=rej;})}
async function drawFiles(){const m=document.getElementById('main');
  m.innerHTML=`<div class="card"><div class="eye">Files</div>
    <div class="tiny" style="margin-top:6px">On this device only. Good for LLC docs, the EIN letter, extracts, term sheets.</div>
    <input type="file" id="fin" multiple style="margin-top:12px" onchange="addFiles()">
    <div id="flist" style="margin-top:12px"><div class="tiny">Loading\u2026</div></div></div>`;
  if(!DB)await openDB();listFiles();}
async function addFiles(){const inp=document.getElementById('fin');if(!DB)await openDB();
  for(const f of inp.files){const id='f'+Date.now()+Math.random().toString(36).slice(2,6);const buf=await f.arrayBuffer();
    await new Promise(r=>{const tx=DB.transaction('files','readwrite');
      tx.objectStore('files').put({id,name:f.name,type:f.type,size:f.size,blob:new Blob([buf],{type:f.type})});tx.oncomplete=r;});}
  toast();listFiles();}
function listFiles(){const rq=DB.transaction('files','readonly').objectStore('files').getAll();
  rq.onsuccess=()=>{const el=document.getElementById('flist');if(!el)return;const fs=rq.result||[];
    el.innerHTML=fs.length?fs.map(f=>`<div class="rowitem"><div style="min-width:0"><div class="fn">${f.name}</div><div class="tiny">${(f.size/1024).toFixed(0)} KB</div></div>
      <div><button class="btn sm ghost" onclick="openFile('${f.id}')">Open</button> <button class="x" onclick="delFile('${f.id}')">\u2715</button></div></div>`).join(''):'<div class="tiny">No files yet.</div>';};}
function openFile(id){const rq=DB.transaction('files','readonly').objectStore('files').get(id);
  rq.onsuccess=()=>{const f=rq.result;if(f)window.open(URL.createObjectURL(f.blob),'_blank')}}
function delFile(id){const tx=DB.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=()=>{toast();listFiles()}}

/* ===================== STARFIELD ===================== */
(function(){const c=document.getElementById('stars');const x=c.getContext('2d');
  function size(){c.width=innerWidth;c.height=innerHeight;}size();addEventListener('resize',size);
  const stars=[...Array(70)].map(()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.3+.2,a:Math.random()*.6+.2,t:Math.random()*6}));
  function tick(){x.clearRect(0,0,c.width,c.height);const now=Date.now()/1000;
    stars.forEach(s=>{const tw=.5+.5*Math.sin(now*.7+s.t);x.beginPath();
      x.globalAlpha=s.a*tw;x.fillStyle='#bcd2ff';x.arc(s.x*c.width,s.y*c.height,s.r,0,7);x.fill();});
    requestAnimationFrame(tick);}tick();
})();
